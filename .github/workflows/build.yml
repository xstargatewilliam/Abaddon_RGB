name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Botão "Run workflow" na aba Actions: compila e publica a versão do .csproj como release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publicar AbaddonRGB.exe (arquivo único, não precisa instalar o .NET)
        run: >
          dotnet publish src/AbaddonRGB/AbaddonRGB.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Gerar checksum SHA-256 do executável
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/AbaddonRGB.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AbaddonRGB.exe" | Set-Content -Encoding ascii publish/AbaddonRGB.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AbaddonRGB-win-x64
          path: |
            publish/AbaddonRGB.exe
            publish/AbaddonRGB.exe.sha256

      - name: Ler a versão do projeto
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/AbaddonRGB/AbaddonRGB.csproj
          $version = @($project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if (-not $version) { throw "Não achei <Version> no AbaddonRGB.csproj" }
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Criar release (botão Run workflow ou tag v*)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Abaddon RGB ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          files: |
            publish/AbaddonRGB.exe
            publish/AbaddonRGB.exe.sha256
          generate_release_notes: true
